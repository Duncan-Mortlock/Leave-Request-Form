<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Leave Request Form</title>
</head>
<body>
  <h1>Submit a Leave Request</h1>
  <form id="leaveForm">
    <label for="name">Name:</label><br>
    <input type="text" id="name" name="name" required /><br><br>

    <label for="email">Email:</label><br>
    <input type="email" id="email" name="email" required /><br><br>

    <label for="start">Start Date:</label><br>
    <input type="date" id="start" name="start" required /><br><br>

    <label for="end">End Date:</label><br>
    <input type="date" id="end" name="end" required /><br><br>

    <label for="comments">Comments (optional):</label><br>
    <textarea id="comments" name="comments"></textarea><br><br>

    <button type="submit">Submit</button>
  </form>

  <p id="message"></p>

  <script>
    const form = document.getElementById('leaveForm');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const data = {
        name: form.name.value,
        email: form.email.value,
        startDate: form.start.value,
        endDate: form.end.value,
        comments: form.comments.value
      };

      try {
        const response = await fetch('https://your-flow-url-here', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(data)
        });

        if (response.ok) {
          document.getElementById('message').textContent = 'Leave request submitted successfully!';
          form.reset();
        } else {
          document.getElementById('message').textContent = 'Error submitting request.';
        }
      } catch (err) {
        document.getElementById('message').textContent = 'Request failed.';
      }
    });
  </script>
</body>
</html>
